<main class="playlist-dialog">
  <p *ngIf="loading">Ładowanie...</p>

  <!-- LISTA PLAYLIST -->
  <section *ngIf="!loading && !selectedPlaylist">
    <ul *ngIf="playlists.length > 0; else empty">
      <li *ngFor="let p of playlists" class="playlist-item">
        <span class="playlist-name">{{ p.name }}</span>

        <button (click)="showSelectedPlaylist(p.id)" [disabled]="loading">
          Pokaż
        </button>

        <button
          *ngIf="p.role === playlistRole.Owner"
          (click)="deletePlaylist(p.id)"
          [disabled]="loading"
        >
          deletePlaylist
        </button>
      </li>
    </ul>

    <ng-template #empty>
      <p>Brak playlist</p>
    </ng-template>
  </section>

  <!-- SZCZEGÓŁY PLAYLISTY -->
   <section *ngIf="selectedPlaylist && !loading" class="playlist-details">
    <h3>
      {{selectedPlaylist.role}}
    </h3> 
   </section>

  <section *ngIf="selectedPlaylist && !loading" class="playlist-details">
    <h3>{{ selectedPlaylist.name }}</h3>
    <button
      *ngIf="selectedPlaylist.role === playlistRole.Owner"
      (click)="openShareDialog(selectedPlaylist.id)"
      [disabled]="loading"
    >
      dodaj znajomego
    </button>

    <button
      *ngIf="selectedPlaylist.role === playlistRole.Owner"
      (click)="sharePlaylistPublically(selectedPlaylist.id)"
      [disabled]="loading"
    >
      udostepnij publicznie
    </button>

    <button
      *ngIf="selectedPlaylist.role === playlistRole.Owner"
      (click)="stopSharePlaylsitPublically(selectedPlaylist.id)"
      [disabled]="loading"
    >
      ustaw prywatnie
    </button>

    <p *ngIf="selectedPlaylist.movies.length === 0">
      Brak filmów w tej playliście
    </p>

    <ul *ngIf="selectedPlaylist.movies.length>0">
      <li *ngFor="let movie of selectedPlaylist.movies">
        {{ movie.title }}
        <button
          *ngIf="selectedPlaylist.role === playlistRole.Owner ||
            selectedPlaylist.role === playlistRole.Editor "
          (click)="deleteFromPlaylist(selectedPlaylist.id, movie.tmdbId)"
          [disabled]="loading"
        >
          Usuń
        </button>
      </li>
    </ul>

    <button (click)="selectedPlaylist = undefined">← Wróć do playlist</button>
  </section>

  <hr />

  <!-- TWORZENIE PLAYLISTY -->
  <section class="create-playlist">
    <h3>Utwórz nową playlistę</h3>

    <input
      type="text"
      placeholder="Nazwa playlisty"
      [(ngModel)]="newPlaylistName"
      [disabled]="loading"
    />

    <div class="create-actions">
      <button
        (click)="createPlaylist()"
        [disabled]="loading || !newPlaylistName.trim()"
      >
        Utwórz
      </button>
    </div>
  </section>
</main>
