<p>manage-movie works!</p>
<main class="main">
  <p *ngIf="loading">loading films</p>

  <div *ngIf="!loading && movies.length === 0">brak</div>

  <div *ngFor="let movie of movies" class="movie-card">
    <h3>{{ movie.tmdbId }}</h3>
    <h3>{{ movie.id }}</h3>
    <h3>{{ movie.title }}</h3>

    <button (click)="showMovieDetails(movie.tmdbId)">
        showMovieDetails
      </button>
    
  </div>
</main>
